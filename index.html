<!--
  ============================================================
  ИНТЕРАКТИВНЫЙ ХОРРОР-ПРИКОЛ — строгий минимализм
  Всё в одном файле: HTML + CSS + JS, без библиотек.

  РЯДОМ С ЭТИМ ФАЙЛОМ:
    audio/scary.mp3   — фоновая страшная музыка
    audio/dynasty.mp3 — трек для красной таблетки
    audio/vkube.mp3   — трек для синей таблетки
    img/hand-red.jpeg  — красная рука
    img/hand-blue.jpeg — синяя рука
    (если у тебя файлы .png — поменяй расширение и в тегах <img> ниже)

  ГДЕ ЧТО ПРАВИТЬ:
    1) SONGS.red.audio / SONGS.blue.audio — пути к аудио (блок JS №1).
    2) SONGS.*.lines — текст песни и время каждой строки (там же).
    3) Константы таймингов — блок JS №2.
  ============================================================
-->
<style>
  /* ---------- БАЗА: чёрный фон, тонкий светлый шрифт ---------- */
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: #fff;
    font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    letter-spacing: .02em;
    font-style: normal;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  audio { display: none; }

  /* ---------- ОВЕРЛЕЙ: разблокировка автоплея аудио ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: .02em;
    cursor: pointer;
    opacity: 1;
    transition: opacity .8s ease;
  }

  /* ---------- СЦЕНЫ ---------- */
  .scene {
    position: fixed;
    inset: 0;
    display: none;              /* по очереди через display */
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 2s ease; /* используется при затухании сцены 2 */
  }
  .scene.active { display: flex; }

  /* ---------- СЦЕНА 1 ---------- */
  #scene1 { flex-direction: column; }

  #questionWrap {
    width: 100%;
    text-align: center;
    padding: 0 8vw;
    opacity: 0;
    transform: scale(1);
    /* opacity за 2с, медленное приближение за 10с — без пульсации и дрожания */
    transition: opacity 2s ease, transform 10s linear;
  }
  #questionWrap.show {
    opacity: 1;
    transform: scale(1.15);
  }
  #question {
    font-size: clamp(22px, 3.6vw, 44px);
    font-weight: 300;
    line-height: 1.4;
    letter-spacing: .02em;
    color: #fff;
  }

  #buttons {
    position: absolute;
    bottom: 12vh;
    display: flex;
    gap: 28px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
  }
  #buttons.show { opacity: 1; pointer-events: auto; }

  .yesBtn {
    background: transparent;
    border: 1px solid #fff;
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: .2em;
    padding: 10px 24px;
    cursor: pointer;
    opacity: 1;
    transition: border-color .4s ease, opacity .4s ease;
  }
  /* без инверсии и без свечения: чуть приглушаем рамку и текст */
  .yesBtn:hover {
    border-color: #aaa;
    opacity: .7;
  }

  /* ---------- СЦЕНА 2: слова «ДА» сыплются с неба ---------- */
  #scene2 {
    display: none;              /* .active включает flex */
    overflow: hidden;
  }
  #scene2.active { display: block; }
  .yesWord {
    position: absolute;
    opacity: 0;
    font-weight: 300;
    font-size: clamp(14px, 1.9vw, 24px);
    letter-spacing: .02em;
    color: #fff;
    /* Длительность и задержка задаются JS через CSS-переменные */
    animation: wordFall var(--dur, 2.4s) cubic-bezier(.22, .68, .3, 1)
               var(--delay, 0s) forwards;
  }
  @keyframes wordFall {
    0%   { opacity: 0; transform: translateY(-120vh); }
    12%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ---------- СЦЕНА 3 ---------- */
  /* Руки стоят в ряд через flex и не накладываются друг на друга.
     Порядок в HTML: сначала красная, потом синяя => синяя справа. */
  #scene3 {
    align-items: flex-end;
    justify-content: center;
    gap: clamp(16px, 6vw, 90px);
    padding: 0 4vw 8vh;
  }
  .hand {
    position: relative;
    flex: 0 1 auto;
    width: clamp(120px, 24vw, 260px);
    height: auto;
    cursor: pointer;
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .hand.up {
    opacity: 1;
    transform: translateY(0);
  }
  .hand:hover {
    opacity: .85;
    transform: translateY(0) scale(1.03);
    transition: opacity .4s ease, transform .4s ease;
  }

  /* ---------- СЦЕНА 4: караоке по центру экрана ---------- */
  #scene4 { align-items: center; justify-content: center; padding: 0; }
  /* Все строки лежат в одной ячейке grid — поэтому текст строго по центру,
     а старая и новая строки накладываются и плавно сменяют друг друга */
  #lyric {
    display: grid;
    place-items: center;
    width: 90vw;
    min-height: 40vh;
    text-align: center;
  }
  .line {
    grid-area: 1 / 1;
    position: relative;
    max-width: 100%;
    opacity: 0;
    transform: translateY(-40px);
    clip-path: inset(0 100% 0 0);
    color: #fff;
    font-weight: 300;
    font-size: clamp(28px, 5vw, 56px);
    line-height: 1.4;
    letter-spacing: .02em;
    transition: opacity .6s ease, transform .6s ease, clip-path .6s ease;
  }
  /* Новая строка спускается сверху, «печатается» слева направо
     и одновременно выходит из лёгкого размытия в резкость */
  .line.show { animation: lineDrop .85s cubic-bezier(.16, 1, .3, 1) forwards; }
  @keyframes lineDrop {
    0%   { opacity: 0; transform: translateY(-40px); clip-path: inset(0 100% 0 0); filter: blur(8px); letter-spacing: .14em; }
    12%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0);    clip-path: inset(0 0 0 0);    filter: blur(0);  letter-spacing: .02em; }
  }
  /* Обычная строка разбивается на слова — они встают волной с задержкой */
  .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(12px);
  }
  .line.show .word { animation: wordRise .5s ease-out forwards; }
  @keyframes wordRise {
    to { opacity: 1; transform: translateY(0); }
  }
  /* Предыдущая строка просто растворяется на месте */
  .line.hide {
    opacity: 0;
    transform: translateY(0);
    clip-path: inset(0 0 0 0);
  }
  /* Припев: крупнее, шире межбуквенный интервал, мягкое «дыхание» и движение */
  .line.dyn {
    font-size: clamp(40px, 8vw, 80px);
    letter-spacing: .05em;
  }
  .line.dyn.show {
    animation: dynDrop .85s cubic-bezier(.16, 1, .3, 1) forwards,
               dynBreath 2.4s ease-in-out .85s infinite alternate;
  }
  @keyframes dynDrop {
    0%   { opacity: 0; transform: translateY(-40px); clip-path: inset(0 100% 0 0); filter: blur(8px); letter-spacing: .16em; }
    12%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0);    clip-path: inset(0 0 0 0);    filter: blur(0);  letter-spacing: .05em; }
  }
  @keyframes dynBreath {
    from { opacity: .9; transform: translateX(-5px); }
    to   { opacity: 1; transform: translateX(5px); }
  }
  /* Тонкая черта под припевом прочерчивается слева направо */
  .line.dyn::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -.18em;
    width: min(62%, 420px);
    height: 1px;
    background: #fff;
    opacity: .55;
    transform: translateX(-50%) scaleX(0);
    transform-origin: center;
    animation: ruleGrow 1.1s .55s ease-out forwards;
  }
  @keyframes ruleGrow {
    to { transform: translateX(-50%) scaleX(1); }
  }
  /* Последняя буква припева («я») тянутся: каждая новая — шире предыдущей */
  .stretch-letter {
    display: inline-block;
    opacity: 0;
    transform: scaleX(.25) translateX(-10px);
    animation: letterStretch .75s cubic-bezier(.16, 1, .3, 1) forwards;
  }
  @keyframes letterStretch {
    from { opacity: 0; transform: scaleX(.25) translateX(-10px); }
    to   { opacity: 1; transform: scaleX(1.55) translateX(0); }
  }

  /* ---------- АДАПТИВНОСТЬ: компьютер и телефон ---------- */

    html, body { height: 100dvh; }

    .line { font-size: clamp(20px, 4.5vh, 40px); }
    .line.dyn { font-size: clamp(30px, 7vh, 60px); }
    #buttons { bottom: 6vh; }
    .hand { width: clamp(90px, 22vh, 200px); }
  }
  /* Убираем синюю подсветку тапа на мобильных */
  * { -webkit-tap-highlight-color: transparent; }
</style>

// Плавное нарастание громкости страшной музыки
function fadeAudioIn(audio, target, ms) {
  audio.volume = 0;
  const t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / ms);
    audio.volume = target * p;
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

// Плавное затухание громкости до нуля, затем остановка
function fadeAudioOut(audio, ms) {
  if (flickerTimer) { clearInterval(flickerTimer); flickerTimer = null; }
  const from = audio.volume;
  if (audio.paused || from <= 0) { audio.pause(); audio.currentTime = 0; return; }
  const t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / ms);
    audio.volume = from * (1 - p);
    if (p < 1) requestAnimationFrame(step);
    else { audio.pause(); audio.currentTime = 0; }
  })(t0);
}

// Пульсация громкости страшной музыки: 0.15–0.5 каждые ~800 мс
function startFlicker() {
  flickerTimer = setInterval(() => {
    if (!scaryMusic.paused) scaryMusic.volume = 0.15 + Math.random() * 0.35;
  }, SCARY_PULSE_MS);
}

// Показ нужной сцены (display/opacity)
function showScene(n) {
  document.querySelectorAll('.scene').forEach((s) => {
    s.classList.remove('active');
    s.style.opacity = '';
  });
  document.getElementById('scene' + n).classList.add('active');
}

   JS №6 — СЦЕНА 2: слова «ДА» сыплются с неба
   ============================================================ */
function fillYesScreen() {
  scene2.style.opacity = '1';
  scene2.innerHTML = '';

  const frag = document.createDocumentFragment();
  for (let i = 0; i < YES_COUNT; i++) {
    const span = document.createElement('span');
    span.className = 'yesWord';
    span.textContent = 'ДА';

    // Каждое слово падает в случайную точку экрана со своей скоростью
    span.style.left = (Math.random() * 92).toFixed(2) + 'vw';
    span.style.top = (Math.random() * 90).toFixed(2) + 'vh';
    span.style.setProperty('--dur',
      (YES_FALL_MIN_MS + Math.random() * (YES_FALL_MAX_MS - YES_FALL_MIN_MS)).toFixed(0) + 'ms');
    span.style.setProperty('--delay',
      (Math.random() * YES_DELAY_MAX_MS).toFixed(0) + 'ms');

    frag.appendChild(span);
  }
  scene2.appendChild(frag);

  // Когда экран заполнился — сцена плавно гаснет (2с), затем сцена 3
  setTimeout(fadeEverythingOut, YES_FILL_MS);
}

function fadeEverythingOut() {
  scene2.style.opacity = '0';               // transition: opacity 2s (CSS)
  setTimeout(() => {
    showScene(3);
    showPills();
  }, SCENE2_FADE_MS);
}

/* ============================================================
   JS №7 — СЦЕНА 3: руки
   ============================================================ */
function showPills() {
  // Мягкое всплытие снизу, друг за другом, за 1.2с (CSS)
  setTimeout(() => handRed.classList.add('up'), 150);
  setTimeout(() => handBlue.classList.add('up'), 650);

  handRed.onclick  = () => chooseHand('red');
  handBlue.onclick = () => chooseHand('blue');
}

function chooseHand(choice) {
  if (scene3.dataset.chosen) return;        // защита от повторного клика
  scene3.dataset.chosen = '1';

  fadeAudioOut(scaryMusic, PILL_FADE_MS);   // музыка затухает и останавливается
  handRed.style.opacity = '0';              // руки растворяются за 1с
  handBlue.style.opacity = '0';

  setTimeout(() => {
    showScene(4);
    startSong(choice);
  }, HANDS_FADE_MS);
}

/* ============================================================
   JS №8 — СЦЕНА 4: караоке со строгой привязкой к времени
   ============================================================ */
function startSong(choice) {
  const song = SONGS[choice];
  songMusic.src = song.audio;
  songMusic.currentTime = 0;
  songMusic.volume = 0.9;
  currentLines = song.lines;
  currentLineIndex = -1;
  lyricEl.replaceChildren();
  songMusic.play().catch(() => {});
}

// Точная синхронизация: НЕ делим трек поровну.
// На каждом timeupdate берём последнюю строку, у которой time <= currentTime.
songMusic.addEventListener('timeupdate', () => {
  if (!currentLines) return;
  const t = songMusic.currentTime;
  let idx = -1;
  for (let i = 0; i < currentLines.length; i++) {
    if (currentLines[i].time <= t) idx = i;
    else break; // массив отсортирован по time
  }
  if (idx >= 0 && idx !== currentLineIndex) {
    currentLineIndex = idx;
    showLyric(currentLines[idx]);
  }
});

function showLyric(line) {
  // Все старые строки плавно растворяются, новая — спускается и печатается
  const oldLines = Array.from(lyricEl.querySelectorAll('.line'));
  const next = document.createElement('div');
  next.className = 'line' + (line.dyn ? ' dyn' : '');

  if (line.dyn) {
    // Припев: отделяем последнюю букву — она будет «тянуться» и повторяться
    const stem = document.createElement('span');
    stem.textContent = line.text;
    const tail = document.createElement('span');
    tail.className = 'dyn-tail';
    next.appendChild(stem);
    next.appendChild(tail);
    next._tail = tail;
  } else {
    // Обычная строка: слова встают волной, одно за другим
    line.text.split(' ').forEach((word, i) => {
      const w = document.createElement('span');
      w.className = 'word';
      w.textContent = word;
      w.style.animationDelay = (i * 0.07).toFixed(2) + 's';
      next.appendChild(w);
      if (i < line.text.split(' ').length - 1) {
        next.appendChild(document.createTextNode(' '));
      }
    });
  }

  lyricEl.appendChild(next);
  requestAnimationFrame(() => next.classList.add('show'));

  oldLines.forEach((old) => {
    old.classList.remove('show');
    old.classList.add('hide');
    setTimeout(() => old.remove(), 700);
  });

  if (line.dyn) startStretch(next, line.text);
}

// Постепенно дописываем последнюю букву: «Династия» → «Династияяяяяяяя»
function startStretch(container, text) {
  clearInterval(stretchTimer);
  const tail = container._tail;
  if (!tail) return;
  const lastLetter = text.slice(-1); // «я» у Династии, «е» у В клубе
  let count = 0;
  stretchTimer = setInterval(() => {
    if (!container.isConnected || count >= 8) {
      clearInterval(stretchTimer);
      return;
    }
    const letter = document.createElement('span');
    letter.className = 'stretch-letter';
    letter.textContent = lastLetter;
    tail.appendChild(letter);
    count++;
  }, 170);
}
</script>
